<section class="dialog-container" aria-labelledby="add-quote-title">
  <div class="dialog-header">
    <div>
      <h2 mat-dialog-title id="add-quote-title">Add New Quote</h2>
      <p>Select a line of business to continue</p>
    </div>

    <button
      mat-icon-button
      class="close-button"
      type="button"
      aria-label="Close"
      (click)="cancel()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">
    <mat-form-field appearance="outline" class="lob-field">
      <mat-label>Line of Business (LOB)</mat-label>
      <mat-select [value]="selectedBusiness" (selectionChange)="selectBusiness($event.value)">
        <mat-option value="Commercial Auto">Commercial Auto</mat-option>
        <mat-option value="Commercial Property">Commercial Property</mat-option>
        <mat-option value="Business Owner Policy">Business Owner's Policy (BOP)</mat-option>
        <mat-option value="Workers Compensation">Workers Compensation</mat-option>
        <mat-option value="Commercial General Liability"
          >Commercial General Liability (CGL)</mat-option
        >
        <mat-option value="Professional Liability">Professional Liability (E&amp;O)</mat-option>
      </mat-select>
    </mat-form-field>
    <p class="field-hint">Choose the insurance product for which you want to create a quote.</p>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-footer" align="end">
    <button mat-button class="cancel-button" type="button" (click)="cancel()">Cancel</button>
    <button
      mat-flat-button
      class="proceed-button"
      type="button"
      [disabled]="!selectedBusiness"
      (click)="proceed()"
    >
      Proceed
    </button>
  </mat-dialog-actions>
</section>
