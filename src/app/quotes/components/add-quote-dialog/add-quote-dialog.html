<div class="dialog-container">
  <div class="dialog-header">
    <div>
      <h2>Add New Quote</h2>
      <p>Select a line of business to continue</p>
    </div>

    <button class="close-button" type="button" (click)="cancel()" title="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-content">
    <label for="lob-select">Line of Business (LOB)</label>

    <div class="select-wrapper">
      <mat-icon class="select-leading-icon">business</mat-icon>

      <select
        id="lob-select"
        class="lob-select"
        [value]="selectedBusiness"
        (change)="selectBusiness($any($event.target).value)"
      >
        <option value="" disabled>Select a line of business</option>
        <option value="Commercial Property">Commercial Property</option>
        <option value="Commercial Auto">Commercial Auto</option>
        <option value="Business Owner Policy">Business Owner's Policy (BOP)</option>
        <option value="Workers Compensation">Workers Compensation</option>
        <option value="Commercial General Liability">Commercial General Liability (CGL)</option>
        <option value="Professional Liability">Professional Liability (E&O)</option>
      </select>

      <mat-icon class="select-arrow">expand_more</mat-icon>
    </div>

    <p class="field-hint">Choose the insurance product for which you want to create a quote.</p>
  </div>

  <div class="dialog-footer">
    <button class="cancel-button" type="button" (click)="cancel()">Cancel</button>

    <button class="proceed-button" type="button" [disabled]="!selectedBusiness" (click)="proceed()">
      Proceed
    </button>
  </div>
</div>
